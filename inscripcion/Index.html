<!doctype html>
<html lang="es">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Inscripción a Torneo | eSports Arena Manager</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="../css/style.css">
    </head>
    <body>
        <header class="py-3 shadow-sm">
            <div class="container d-flex flex-wrap justify-content-between align-items-center">
            <h1 class="titulo-principal">eSports Arena Manager</h1>
            <nav>
                <ul class="nav">
                <li class="nav-item"><a href="../index.html" class="nav-link">Inicio</a></li>
                <li class="nav-item"><a href="../torneos/index.html" class="nav-link">Torneos</a></li>
                <li class="nav-item"><a href="index.html" class="nav-link active">Inscripción</a></li>
                <li class="nav-item"><a href="../equipos/index.html" class="nav-link">Equipos</a></li>
                <li class="nav-item"><a href="../perfil/index.html" class="nav-link">Perfil</a></li>
                </ul>
            </nav>
            </div>
        </header>

        <div class="container my-5">
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-6">
                <div class="card tarjeta border-secondary p-4">
                    <h3 class="text-info text-center mb-4">Inscripción de Jugador</h3>
                    
                    <div id="mensaje-error" class="alert alert-danger d-none" role="alert"></div>

                    <form id="form-registro">
                    
                    
                    <div class="row mb-3">

                        <div class="col-md-6">
                            <label for="apellidos" class="form-label text-light">Nombre Perfil o Apodo *</label>
                            <input type="text" id="apodo" class="form-control bg-dark text-light border-secondary" maxlength="100">
                        </div>

                        <div class="col-md-6">
                             <label for="run" class="form-label text-light">RUN *</label>
                            <input type="text" id="run" class="form-control bg-dark text-light border-secondary" placeholder="Sin puntos ni guion (Ej: 19011022K)" maxlength="9">
                        </div>
                    

                        <div class="col-md-6">
                            <label for="fecha-nac" class="form-label text-light">Fecha Nacimiento (Opcional)</label>
                            <input type="date" id="fecha-nac" class="form-control bg-dark text-light border-secondary" placeholder="DD/MM/YYYY" onfocus="(this.type='date')" onblur="if(this.value===''){this.type='text'}">
                        </div>
            

                        <div class="col-md-6">
                            <label for="nombre" class="form-label text-light">Nombres *</label>
                            <input type="text" id="nombre" class="form-control bg-dark text-light border-secondary" maxlength="50">
                        </div>

                        <div class="col-md-6">
                            <label for="apellidos" class="form-label text-light">Apellidos *</label>
                            <input type="text" id="apellidos" class="form-control bg-dark text-light border-secondary" maxlength="100">
                            </div>
                        </div>


                        <div class="col-md-6">
                            <label for="correo" class="form-label text-light">Correo Electrónico *</label>
                            <input type="email" id="correo" class="form-control bg-dark text-light border-secondary" placeholder="@duoc.cl, @profesor.duoc.cl o @gmail.com" maxlength="100">
                        </div>

                        <div class="col-md-6">
                            <label for="contrasena" class="form-label text-light">Contraseña *</label>
                            <input type="password" id="contrasena" class="form-control bg-dark text-light border-secondary" placeholder="Entre 4 y 10 caracteres" minlength="4" maxlength="10">
                        </div>

                        <button type="submit" class="btn boton-primario button-top">Crear Cuenta</button>
                    </div>
                    </form>
                </div>
            </div>
        </div>

        <footer class="py-4 mt-auto text-center">
            <p class="mb-0 ">© 2026 eSports Arena Manager. Todos los derechos reservados.</p>
        </footer>
        
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
        <script src="js/app.js"></script>

    </body>
</html>
